name: fire-assistant
services:
  db:
    image: public.ecr.aws/docker/library/mysql:8.4@sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70
    restart: unless-stopped
    mem_limit: 650m
    environment:
      MYSQL_DATABASE: fire_assistant
      MYSQL_USER: fire_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Required}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--innodb-buffer-pool-size=128M", "--mysqlx=OFF", "--performance-schema=OFF", "--max-connections=35"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql -h127.0.0.1 -u\"$${MYSQL_USER}\" \"$${MYSQL_DATABASE}\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 35
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  api:
    image: public.ecr.aws/docker/library/eclipse-temurin:17-jre
    restart: unless-stopped
    mem_limit: 650m
    user: "10001:10001"
    ports:
      - "127.0.0.1:8081:8081"
    working_dir: /app
    command: ["java", "-Xms96m", "-Xmx320m", "-XX:MaxMetaspaceSize=160m", "-jar", "/app/app.jar"]
    environment:
      API_PORT: 8081
      DB_URL: jdbc:mysql://db:3306/fire_assistant?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      DB_USER: fire_app
      DB_PASSWORD: ${DB_PASSWORD:?Required}
      JWT_SECRET: ${JWT_SECRET:?Required}
      DEMO_ENABLED: ${DEMO_ENABLED:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      UPLOAD_DIR: /data/uploads
      CORS_ORIGINS: http://localhost,https://localhost,capacitor://localhost
      TZ: Asia/Shanghai
    volumes:
      - ./app.jar:/app/app.jar:ro
      - ../../shared/uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    logging: *logging
  web:
    image: public.ecr.aws/docker/library/nginx:stable-alpine
    restart: unless-stopped
    mem_limit: 96m
    ports:
      - "80:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../shared/downloads:/srv/downloads:ro
    depends_on:
      - api
    logging: *logging
volumes:
  mysql-data:
